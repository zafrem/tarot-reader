<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 450" width="300" height="450">
  <rect width="300" height="450" fill="#5c3a21"/>

    <!-- sigil: 2 small pentacles glyphs, one per pip -->
  <path d="M 132 104 L 123 86 L 141 86 Z" fill="none" stroke="#9aa66b" stroke-width="2.5" stroke-linejoin="round"/>
  <line x1="123" y1="95" x2="141" y2="95" stroke="#9aa66b" stroke-width="2.5"/>
  <path d="M 168 104 L 159 86 L 177 86 Z" fill="none" stroke="#9aa66b" stroke-width="2.5" stroke-linejoin="round"/>
  <line x1="159" y1="95" x2="177" y2="95" stroke="#9aa66b" stroke-width="2.5"/>

  <!-- name -->
  <text x="150" y="255" text-anchor="middle" font-family="Iowan Old Style, Palatino, Georgia, serif" font-size="50" font-weight="700" fill="#9aa66b">Two of</text>
  <text x="150" y="313" text-anchor="middle" font-family="Iowan Old Style, Palatino, Georgia, serif" font-size="50" font-weight="700" fill="#9aa66b">Pentacles</text>

  <!-- rank index -->
  <text x="26" y="424" font-family="Iowan Old Style, Palatino, Georgia, serif" font-size="15" fill="#9aa66b" opacity="0.7">2</text>
</svg>

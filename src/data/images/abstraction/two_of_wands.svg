<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 450" width="300" height="450">
  <rect width="300" height="450" fill="#b5451b"/>

    <!-- sigil: 2 small wands glyphs, one per pip -->
  <path d="M 132 86 L 123 104 L 141 104 Z" fill="none" stroke="#f6ead1" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M 168 86 L 159 104 L 177 104 Z" fill="none" stroke="#f6ead1" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- name -->
  <text x="150" y="255" text-anchor="middle" font-family="Iowan Old Style, Palatino, Georgia, serif" font-size="50" font-weight="700" fill="#f6ead1">Two of</text>
  <text x="150" y="313" text-anchor="middle" font-family="Iowan Old Style, Palatino, Georgia, serif" font-size="50" font-weight="700" fill="#f6ead1">Wands</text>

  <!-- rank index -->
  <text x="26" y="424" font-family="Iowan Old Style, Palatino, Georgia, serif" font-size="15" fill="#f6ead1" opacity="0.7">2</text>
</svg>

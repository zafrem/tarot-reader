<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 450" width="300" height="450">
  <rect width="300" height="450" fill="#1c3d5a"/>

    <!-- sigil: 7 small cups glyphs, one per pip -->
  <path d="M 96 89 L 87 71 L 105 71 Z" fill="none" stroke="#bfe3d0" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M 132 89 L 123 71 L 141 71 Z" fill="none" stroke="#bfe3d0" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M 168 89 L 159 71 L 177 71 Z" fill="none" stroke="#bfe3d0" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M 204 89 L 195 71 L 213 71 Z" fill="none" stroke="#bfe3d0" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M 114 121 L 105 103 L 123 103 Z" fill="none" stroke="#bfe3d0" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M 150 121 L 141 103 L 159 103 Z" fill="none" stroke="#bfe3d0" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M 186 121 L 177 103 L 195 103 Z" fill="none" stroke="#bfe3d0" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- name -->
  <text x="150" y="255" text-anchor="middle" font-family="Iowan Old Style, Palatino, Georgia, serif" font-size="50" font-weight="700" fill="#bfe3d0">Seven</text>
  <text x="150" y="313" text-anchor="middle" font-family="Iowan Old Style, Palatino, Georgia, serif" font-size="50" font-weight="700" fill="#bfe3d0">of Cups</text>

  <!-- rank index -->
  <text x="26" y="424" font-family="Iowan Old Style, Palatino, Georgia, serif" font-size="15" fill="#bfe3d0" opacity="0.7">7</text>
</svg>

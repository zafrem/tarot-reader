<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 450" width="300" height="450">
  <rect width="300" height="450" fill="#5c3a21"/>

    <!-- sigil: 4 small pentacles glyphs, one per pip -->
  <path d="M 132 89 L 123 71 L 141 71 Z" fill="none" stroke="#9aa66b" stroke-width="2.5" stroke-linejoin="round"/>
  <line x1="123" y1="80" x2="141" y2="80" stroke="#9aa66b" stroke-width="2.5"/>
  <path d="M 168 89 L 159 71 L 177 71 Z" fill="none" stroke="#9aa66b" stroke-width="2.5" stroke-linejoin="round"/>
  <line x1="159" y1="80" x2="177" y2="80" stroke="#9aa66b" stroke-width="2.5"/>
  <path d="M 132 121 L 123 103 L 141 103 Z" fill="none" stroke="#9aa66b" stroke-width="2.5" stroke-linejoin="round"/>
  <line x1="123" y1="112" x2="141" y2="112" stroke="#9aa66b" stroke-width="2.5"/>
  <path d="M 168 121 L 159 103 L 177 103 Z" fill="none" stroke="#9aa66b" stroke-width="2.5" stroke-linejoin="round"/>
  <line x1="159" y1="112" x2="177" y2="112" stroke="#9aa66b" stroke-width="2.5"/>

  <!-- name -->
  <text x="150" y="255" text-anchor="middle" font-family="Iowan Old Style, Palatino, Georgia, serif" font-size="50" font-weight="700" fill="#9aa66b">Four of</text>
  <text x="150" y="313" text-anchor="middle" font-family="Iowan Old Style, Palatino, Georgia, serif" font-size="50" font-weight="700" fill="#9aa66b">Pentacles</text>

  <!-- rank index -->
  <text x="26" y="424" font-family="Iowan Old Style, Palatino, Georgia, serif" font-size="15" fill="#9aa66b" opacity="0.7">4</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 450" width="300" height="450">
  <rect width="300" height="450" fill="#b5451b"/>

  <!-- small sigil: the alchemical glyph for Fire -->
  <path d="M 150 66 L 128 118 L 172 118 Z" fill="none" stroke="#f6ead1" stroke-width="4" stroke-linejoin="round"/>

  <!-- name, the dominant element, wrapped to two lines -->
  <text x="150" y="255" text-anchor="middle" font-family="Iowan Old Style, Palatino, Georgia, serif" font-size="50" font-weight="700" fill="#f6ead1">Ace of</text>
  <text x="150" y="313" text-anchor="middle" font-family="Iowan Old Style, Palatino, Georgia, serif" font-size="50" font-weight="700" fill="#f6ead1">Wands</text>

  <!-- small rank index, tucked low -->
  <text x="26" y="424" font-family="Iowan Old Style, Palatino, Georgia, serif" font-size="15" fill="#f6ead1" opacity="0.7">A</text>
</svg>

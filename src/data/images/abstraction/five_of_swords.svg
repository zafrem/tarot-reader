<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 450" width="300" height="450">
  <rect width="300" height="450" fill="#a89f91"/>

    <!-- sigil: 5 small swords glyphs, one per pip -->
  <path d="M 114 71 L 105 89 L 123 89 Z" fill="none" stroke="#2b2620" stroke-width="2.5" stroke-linejoin="round"/>
  <line x1="105" y1="80" x2="123" y2="80" stroke="#2b2620" stroke-width="2.5"/>
  <path d="M 150 71 L 141 89 L 159 89 Z" fill="none" stroke="#2b2620" stroke-width="2.5" stroke-linejoin="round"/>
  <line x1="141" y1="80" x2="159" y2="80" stroke="#2b2620" stroke-width="2.5"/>
  <path d="M 186 71 L 177 89 L 195 89 Z" fill="none" stroke="#2b2620" stroke-width="2.5" stroke-linejoin="round"/>
  <line x1="177" y1="80" x2="195" y2="80" stroke="#2b2620" stroke-width="2.5"/>
  <path d="M 132 103 L 123 121 L 141 121 Z" fill="none" stroke="#2b2620" stroke-width="2.5" stroke-linejoin="round"/>
  <line x1="123" y1="112" x2="141" y2="112" stroke="#2b2620" stroke-width="2.5"/>
  <path d="M 168 103 L 159 121 L 177 121 Z" fill="none" stroke="#2b2620" stroke-width="2.5" stroke-linejoin="round"/>
  <line x1="159" y1="112" x2="177" y2="112" stroke="#2b2620" stroke-width="2.5"/>

  <!-- name -->
  <text x="150" y="255" text-anchor="middle" font-family="Iowan Old Style, Palatino, Georgia, serif" font-size="50" font-weight="700" fill="#2b2620">Five of</text>
  <text x="150" y="313" text-anchor="middle" font-family="Iowan Old Style, Palatino, Georgia, serif" font-size="50" font-weight="700" fill="#2b2620">Swords</text>

  <!-- rank index -->
  <text x="26" y="424" font-family="Iowan Old Style, Palatino, Georgia, serif" font-size="15" fill="#2b2620" opacity="0.7">5</text>
</svg>

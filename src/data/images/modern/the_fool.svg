<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 450" width="300" height="450">
  <rect width="300" height="450" fill="#1b3a2f"/>

  <!-- corner rank index -->
  <text x="30" y="52" font-family="Iowan Old Style, Palatino, Georgia, serif" font-size="24" fill="#c9a15a">0</text>

  <!-- sigil: an open ring (the void / zero) with a line stepping past its edge -->
  <circle cx="150" cy="195" r="68" fill="none" stroke="#c9a15a" stroke-width="5"/>
  <line x1="150" y1="195" x2="215" y2="120" stroke="#c9a15a" stroke-width="5" stroke-linecap="round"/>
  <circle cx="215" cy="120" r="7" fill="#c9a15a"/>

  <!-- name ribbon -->
  <rect x="0" y="362" width="300" height="62" fill="#c9a15a"/>
  <text x="28" y="402" font-family="Iowan Old Style, Palatino, Georgia, serif" font-size="28" font-weight="700" fill="#1b3a2f">The Fool</text>
</svg>
